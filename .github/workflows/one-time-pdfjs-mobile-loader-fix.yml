name: One-time PDF.js mobile loader repair

on:
  push:
    paths:
      - '.github/workflows/one-time-pdfjs-mobile-loader-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-rebuild:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Apply guarded PDF.js loader refactor
        run: |
          python3 <<'PY'
          import re
          import textwrap
          from pathlib import Path

          root = Path('plugin')

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_regex_once(path, pattern, replacement):
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}')
              path.write_text(updated, encoding='utf-8')

          viewer_files = ('ebookviewer.js', 'bookviewer.js', 'pdfviewer.js')
          for filename in viewer_files:
              path = root / 'amd/src' / filename
              replace_once(
                  path,
                  "define(['core/ajax', 'core/notification'], function(Ajax, Notification) {",
                  "define(['core/ajax', 'core/notification', 'mod_videoplayer/pdfjsloader'], "
                  "function(Ajax, Notification, PdfjsLoader) {"
              )
              replace_once(
                  path,
                  "    const PDFJS_URL = M.cfg.wwwroot + '/mod/videoplayer/thirdpartylibs/pdfjs/pdf.min.mjs';\n"
                  "    const PDFJS_WORKER_URL = M.cfg.wwwroot + "
                  "'/mod/videoplayer/thirdpartylibs/pdfjs/pdf.worker.min.mjs';\n",
                  ""
              )
              replace_once(path, "    let pdfjsPromise = null;\n", "")
              replace_regex_once(
                  path,
                  r"    const loadPdfJs = function\(\) \{\n.*?^    \};\n\n",
                  ""
              )
              text = path.read_text(encoding='utf-8')
              if text.count('loadPdfJs()') != 1:
                  raise RuntimeError(f'{filename}: unexpected loadPdfJs() call count')
              path.write_text(text.replace('loadPdfJs()', 'PdfjsLoader.load()'), encoding='utf-8')

          loader = root / 'amd/src/pdfjsloader.js'
          if loader.exists():
              raise RuntimeError('pdfjsloader.js already exists')
          loader.write_text(textwrap.dedent("""\
              // This file is part of Moodle - http://moodle.org/
              //
              // Moodle is free software: you can redistribute it and/or modify
              // it under the terms of the GNU General Public License as published by
              // the Free Software Foundation, either version 3 of the License, or
              // (at your option) any later version.
              //
              // Moodle is distributed in the hope that it will be useful,
              // but WITHOUT ANY WARRANTY; without even the implied warranty of
              // MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the
              // GNU General Public License for more details.
              //
              // You should have received a copy of the GNU General Public License
              // along with Moodle. If not, see <http://www.gnu.org/licenses/>.

              /**
               * Normalised local PDF.js loader for Drive Resource.
               *
               * Dynamic import implementations can expose PDF.js as a direct ESM
               * namespace, a default wrapper, or the global namespace installed by
               * the bundle. This adapter validates those shapes before configuring
               * the locally bundled worker.
               *
               * @module     mod_videoplayer/pdfjsloader
               * @copyright  2026 Jose Erasmo Moreno Salgado - Elearning Cloud
               * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later
               */
              define([], function() {
                  const PDFJS_URL = M.cfg.wwwroot + '/mod/videoplayer/thirdpartylibs/pdfjs/pdf.min.mjs';
                  const PDFJS_WORKER_URL = M.cfg.wwwroot +
                      '/mod/videoplayer/thirdpartylibs/pdfjs/pdf.worker.min.mjs';

                  let loadPromise = null;

                  /**
                   * Determine whether a value exposes the PDF.js viewer contract.
                   *
                   * @param {*} candidate
                   * @returns {boolean}
                   */
                  const isLibrary = function(candidate) {
                      return Boolean(
                          candidate &&
                          typeof candidate.getDocument === 'function' &&
                          candidate.GlobalWorkerOptions
                      );
                  };

                  /**
                   * Resolve PDF.js from known browser module namespace shapes.
                   *
                   * @param {Object} moduleNamespace
                   * @returns {Object}
                   * @throws {TypeError}
                   */
                  const resolveLibrary = function(moduleNamespace) {
                      const candidates = [
                          moduleNamespace,
                          moduleNamespace && moduleNamespace.default,
                          moduleNamespace && moduleNamespace.pdfjsLib,
                          window.pdfjsLib || null
                      ];

                      for (let index = 0; index < candidates.length; index++) {
                          if (isLibrary(candidates[index])) {
                              return candidates[index];
                          }
                      }

                      throw new TypeError('Drive Resource could not initialise the local PDF.js API.');
                  };

                  /**
                   * Load and configure the bundled PDF.js API once per page.
                   *
                   * @returns {Promise<Object>}
                   */
                  const load = function() {
                      if (!loadPromise) {
                          loadPromise = import(PDFJS_URL).then(function(moduleNamespace) {
                              const pdfjsLib = resolveLibrary(moduleNamespace);
                              pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
                              return pdfjsLib;
                          });
                      }
                      return loadPromise;
                  };

                  return {load: load};
              });
              """), encoding='utf-8')

          version = root / 'version.php'
          replace_once(version, "$plugin->version = 2026080503;", "$plugin->version = 2026080504;")
          replace_once(version, "$plugin->release = '1.1.24-beta';", "$plugin->release = '1.1.25-beta';")
          PY

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0 build environment
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Build AMD bundles with Moodle 5.0 Grunt
        run: |
          INSTALLED_PLUGIN=$(find -L "$HOME" -type d -path '*/mod/videoplayer' -print -quit)
          if [ -z "$INSTALLED_PLUGIN" ]; then
            echo 'Installed mod/videoplayer directory was not found.' >&2
            exit 1
          fi
          MOODLE_ROOT=$(dirname "$(dirname "$INSTALLED_PLUGIN")")
          cd "$MOODLE_ROOT"
          npx grunt amd --root=mod/videoplayer

          SOURCE_BUILD=$(readlink -f "$INSTALLED_PLUGIN/amd/build")
          TARGET_BUILD=$(readlink -f "$GITHUB_WORKSPACE/plugin/amd/build")
          if [ "$SOURCE_BUILD" != "$TARGET_BUILD" ]; then
            rsync -a --delete "$INSTALLED_PLUGIN/amd/build/" "$GITHUB_WORKSPACE/plugin/amd/build/"
          fi

      - name: Validate rebuilt AMD sources and bundles
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Commit repaired source and generated bundles
        run: |
          cd plugin
          rm .github/workflows/one-time-pdfjs-mobile-loader-fix.yml
          git config user.name 'Elearning Cloud'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git add amd/src amd/build version.php .github/workflows/one-time-pdfjs-mobile-loader-fix.yml
          git diff --cached --check
          git commit -m 'fix(pdfjs): normalise mobile module exports and worker setup'
          git push
