name: One-time Moodle style autofix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: "${{ !contains(github.event.head_commit.message, 'style: apply automated Moodle fixes') }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Moodle CodeSniffer
        run: composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci

      - name: Apply automatic Moodle CodeSniffer fixes
        run: |
          mapfile -d '' files < <(git ls-files -z '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked PHP files found."
            exit 0
          fi

          set +e
          ci/vendor/bin/phpcbf --standard=moodle "${files[@]}"
          result=$?
          set -e

          rm -rf ci

          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi

      - name: Commit mechanical fixes
        run: |
          rm -rf ci
          if git diff --quiet; then
            echo "No automatic fixes were required."
            exit 0
          fi
          git config user.name "Elearning Cloud CI"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add --update
          git commit -m "style: apply automated Moodle fixes"
          git push origin HEAD:main
