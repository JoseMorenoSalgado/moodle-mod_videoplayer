name: One-time Moodle style autofix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply automated Moodle fixes') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Moodle Plugin CI
        run: composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci

      - name: Apply automatic Moodle CodeSniffer fixes
        run: |
          set +e
          ci/bin/moodle-plugin-ci phpcbf .
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi

      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No automatic fixes were required."
            exit 0
          fi
          git config user.name "Elearning Cloud CI"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add --all
          git commit -m "style: apply automated Moodle fixes"
          git push origin HEAD:main
