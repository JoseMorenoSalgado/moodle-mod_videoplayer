name: Fix upgrade whitespace

'on':
  push:
    branches:
      - fix/pdfjs-stable-viewer
    paths:
      - .github/workflows/fix-upgrade-whitespace.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdfjs-stable-viewer
          fetch-depth: 0

      - name: Remove duplicate upgrade whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('db/upgrade.php')
          content = path.read_text(encoding='utf-8')
          old = "        upgrade_mod_savepoint(true, 2026080501, 'videoplayer');\n    }\n\n\n    if ($oldversion < 2026080600) {"
          new = "        upgrade_mod_savepoint(true, 2026080501, 'videoplayer');\n    }\n\n    if ($oldversion < 2026080600) {"
          if old not in content:
              raise SystemExit('Expected duplicate whitespace was not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-upgrade-whitespace.yml

      - name: Validate PHP syntax
        run: php -l db/upgrade.php

      - name: Commit correction
        run: |
          git config user.name "Elearning Cloud"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add -A
          git commit -m "style: remove duplicate upgrade whitespace"
          git push origin HEAD:fix/pdfjs-stable-viewer
