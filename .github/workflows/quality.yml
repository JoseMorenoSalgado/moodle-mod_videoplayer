name: Drive Resource quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'production/**'

permissions:
  contents: read

jobs:
  static-analysis:
    name: PHP ${{ matrix.php }} static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, xml
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: XML well-formedness
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            foreach (["db/install.xml", "thirdpartylibs.xml"] as $file) {
                libxml_use_internal_errors(true);
                if (simplexml_load_file($file) === false) {
                    fwrite(STDERR, "Invalid XML: {$file}\n");
                    exit(1);
                }
            }
          '

      - name: Protected architecture guardrails
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'drive\.google\.com/.*/preview|iframeurl|preview_url' view.php templates classes/output; then
            echo 'Google preview/iframe path detected in protected learner-facing architecture.' >&2
            exit 1
          fi
          test -f thirdpartylibs/pdfjs/pdf.min.mjs
          test -f thirdpartylibs/pdfjs/pdf.worker.min.mjs
          test -f thirdpartylibs/plyr/plyr.min.js
          test -f thirdpartylibs/plyr/plyr.css

  javascript:
    name: JavaScript syntax and AMD consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find amd/src amd/build -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Critical AMD bundle consistency
        shell: bash
        run: |
          set -euo pipefail
          cmp amd/src/pdfviewer.js amd/build/pdfviewer.min.js
          test -f amd/build/pdfmobile.min.js

      - name: No runtime CDN dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'https?://(cdn\.|cdnjs\.|unpkg\.|jsdelivr\.)' amd templates *.php classes 2>/dev/null; then
            echo 'Runtime CDN dependency detected.' >&2
            exit 1
          fi
