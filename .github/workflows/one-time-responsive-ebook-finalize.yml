name: One-time responsive ebook finalization

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: one-time-responsive-ebook-finalization
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Apply guarded source and release updates
        working-directory: plugin
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('amd/src/ebookviewer.js')
          content = source.read_text()
          obsolete = '/* eslint-disable promise/no-nesting */\n'
          if content.count(obsolete) != 1:
              raise SystemExit('Expected exactly one obsolete promise/no-nesting directive')
          source.write_text(content.replace(obsolete, '', 1))

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'view.php',
              "        $PAGE->requires->css('/mod/videoplayer/thirdpartylibs/pageflip/page-flip.css');\n"
              "        $PAGE->requires->js_call_amd('mod_videoplayer/ebookviewer', 'init');",
              "        $PAGE->requires->css('/mod/videoplayer/thirdpartylibs/pageflip/page-flip.css');\n"
              "        $PAGE->requires->css('/mod/videoplayer/styles_pageflip_fix.css');\n"
              "        $PAGE->requires->js_call_amd('mod_videoplayer/ebookviewer', 'init');"
          )
          replace_once('version.php', '$plugin->version = 2026080504;', '$plugin->version = 2026080505;')
          replace_once('version.php', "$plugin->release = '1.1.25-beta';", "$plugin->release = '1.1.26-beta';")
          PY

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0 build environment
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --no-init

      - name: Build responsive Ebook AMD bundle
        run: |
          cd moodle
          npx grunt amd --root=mod/videoplayer
          cp mod/videoplayer/amd/build/ebookviewer.min.js ../plugin/amd/build/ebookviewer.min.js
          cp mod/videoplayer/amd/build/ebookviewer.min.js.map ../plugin/amd/build/ebookviewer.min.js.map

      - name: Validate source and production bundle
        run: |
          SOURCE=plugin/amd/src/ebookviewer.js
          BUNDLE=plugin/amd/build/ebookviewer.min.js
          VIEW=plugin/view.php
          test -s "$BUNDLE"
          test "$(wc -c < "$BUNDLE")" -gt 1000
          grep -q 'is-phone-single-page' "$SOURCE"
          grep -q 'is-desktop-double-page' "$SOURCE"
          grep -q 'requestIdleCallback' "$SOURCE"
          grep -q 'usePortrait: phoneLayout' "$SOURCE"
          grep -q 'mod_videoplayer/ebookviewer' "$BUNDLE"
          grep -q 'styles_pageflip_fix.css' "$VIEW"
          git -C plugin status --short -- amd/build/ebookviewer.min.js | grep -q 'ebookviewer.min.js'
          if grep -q 'MAX_INITIAL_RENDER_PAGES' "$SOURCE"; then
            echo 'Eager multi-page rendering returned.' >&2
            exit 1
          fi
          git -C plugin diff --check

      - name: Commit responsive Ebook release
        working-directory: plugin
        run: |
          git config user.name 'Elearning Cloud'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git rm .github/workflows/one-time-responsive-ebook-rebuild.yml
          git rm .github/workflows/one-time-responsive-ebook-finalize.yml
          git add \
            amd/src/ebookviewer.js \
            amd/build/ebookviewer.min.js \
            amd/build/ebookviewer.min.js.map \
            view.php \
            version.php
          git commit -m 'feat(ebook): finalize responsive lazy page reader'
          git push
