name: One-time PDF.js ESM loader rebuild

on:
  push:
    paths:
      - '.github/workflows/one-time-pdfjs-esm-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0 build environment
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Build AMD bundles with Moodle 5.0 Grunt
        run: |
          INSTALLED_PLUGIN=$(find -L "$HOME" -type d -path '*/mod/videoplayer' -print -quit)
          if [ -z "$INSTALLED_PLUGIN" ]; then
            echo 'Installed mod/videoplayer directory was not found.' >&2
            exit 1
          fi
          MOODLE_ROOT=$(dirname "$(dirname "$INSTALLED_PLUGIN")")
          cd "$MOODLE_ROOT"
          npx grunt amd --root=mod/videoplayer

          SOURCE_BUILD=$(readlink -f "$INSTALLED_PLUGIN/amd/build")
          TARGET_BUILD=$(readlink -f "$GITHUB_WORKSPACE/plugin/amd/build")
          if [ "$SOURCE_BUILD" != "$TARGET_BUILD" ]; then
            rsync -a --delete "$INSTALLED_PLUGIN/amd/build/" "$GITHUB_WORKSPACE/plugin/amd/build/"
          fi

      - name: Validate ESM loader bundle
        run: |
          moodle-plugin-ci grunt --max-lint-warnings 0
          BUNDLE=plugin/amd/build/pdfjsloader.min.js
          test -f "$BUNDLE"
          grep -q 'type="module"' "$BUNDLE"
          grep -q 'createElement("script")' "$BUNDLE"
          if grep -q '_systemImportTransformerGlobalIdentifier' "$BUNDLE"; then
            echo 'Dynamic import transformer is still present in the PDF.js loader bundle.' >&2
            exit 1
          fi

      - name: Commit generated bundle
        run: |
          cd plugin
          rm .github/workflows/one-time-pdfjs-esm-rebuild.yml
          git config user.name 'Elearning Cloud'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git add amd/build .github/workflows/one-time-pdfjs-esm-rebuild.yml
          git diff --cached --check
          git commit -m 'build(amd): compile native PDF.js ESM loader'
          git push
