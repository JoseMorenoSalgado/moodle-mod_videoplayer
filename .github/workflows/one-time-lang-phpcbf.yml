name: One-time Moodle 5.0 language PHPCBF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Apply the installed Moodle ruleset
        run: |
          set +e
          moodle-plugin-ci phpcbf
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi
          if git -C plugin diff --quiet -- lang/en/videoplayer.php lang/es/videoplayer.php; then
            echo "Moodle Plugin CI did not modify the language files."
            exit 1
          fi

      - name: Remove temporary workflow
        run: rm -f plugin/.github/workflows/one-time-lang-phpcbf.yml

      - name: Commit formatter output
        run: |
          git -C plugin config user.name "Elearning Cloud CI"
          git -C plugin config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git -C plugin add lang/en/videoplayer.php lang/es/videoplayer.php .github/workflows/one-time-lang-phpcbf.yml
          git -C plugin commit -m "style: format Moodle language files"
          git -C plugin push origin HEAD:main
