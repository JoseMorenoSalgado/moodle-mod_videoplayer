name: One-time Moodle language PHPCBF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Moodle CodeSniffer
        run: composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci

      - name: Format language files with full Moodle standard
        run: |
          set +e
          ci/vendor/bin/phpcbf --standard=moodle \
            lang/en/videoplayer.php \
            lang/es/videoplayer.php
          result=$?
          set -e
          rm -rf ci
          if [ "$result" -gt 1 ]; then
            exit "$result"
          fi
          if git diff --quiet -- lang/en/videoplayer.php lang/es/videoplayer.php; then
            echo "PHPCBF did not modify the language files."
            exit 1
          fi

      - name: Remove temporary workflow
        run: rm -f .github/workflows/one-time-lang-phpcbf.yml

      - name: Commit formatter output
        run: |
          git config user.name "Elearning Cloud CI"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add lang/en/videoplayer.php lang/es/videoplayer.php .github/workflows/one-time-lang-phpcbf.yml
          git commit -m "style: format Moodle language files"
          git push origin HEAD:main
