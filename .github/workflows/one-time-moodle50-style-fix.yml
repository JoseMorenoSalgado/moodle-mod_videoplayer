name: One-time Moodle 5.0 documentation fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled documentation and guard fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          copyright_line = " * @copyright  2026 Jose Erasmo Moreno Salgado - Elearning Cloud\n"
          license_line = " * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later\n"

          file_descriptions = {
              "lang/en/videoplayer.php": "English language strings for Drive Resource.",
              "lang/es/videoplayer.php": "Spanish language strings for Drive Resource.",
              "version.php": "Version metadata for Drive Resource.",
              "view.php": "Learner-facing Drive Resource activity page.",
              "lib.php": "Core callbacks for the Drive Resource activity module.",
              "db/tasks.php": "Scheduled task definitions for Drive Resource.",
              "settings.php": "Administration settings for Drive Resource.",
          }

          for filename, description in file_descriptions.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              insertion_index = next(
                  (index + 1 for index, line in enumerate(lines) if "along with Moodle.  If not, see" in line),
                  None,
              )
              if insertion_index is None:
                  raise RuntimeError(f"License line not found in {filename}")

              docblock = (
                  "\n/**\n"
                  + f" * {description}\n"
                  + " *\n"
                  + " * @package    mod_videoplayer\n"
                  + copyright_line
                  + license_line
                  + " */\n"
              )
              lines.insert(insertion_index, docblock)
              path.write_text("".join(lines), encoding="utf-8")

          guard_files = [
              "lib.php",
              "db/upgrade.php",
              "backup/moodle2/backup_videoplayer_stepslib.php",
              "backup/moodle2/restore_videoplayer_stepslib.php",
              "classes/local/http_range_proxy.php",
              "classes/task/cleanup_pdf_cache.php",
              "classes/task/precache_pdf.php",
          ]
          guard = "defined('MOODLE_INTERNAL') || die();\n\n"
          for filename in guard_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if guard not in text:
                  raise RuntimeError(f"Expected guard not found in {filename}")
              path.write_text(text.replace(guard, "", 1), encoding="utf-8")

          lib = Path("lib.php")
          text = lib.read_text(encoding="utf-8")
          constant = "const VIDEOPLAYER_LOCALPDF_FILEAREA = 'localpdf';"
          if constant not in text:
              raise RuntimeError("Drive Resource file-area constant not found")
          documented_constant = (
              "/** Moodle File API area for locally protected PDF files. */\n"
              + constant
          )
          lib.write_text(text.replace(constant, documented_constant, 1), encoding="utf-8")

          Path(".github/workflows/one-time-moodle50-style-fix.yml").unlink()
          PY

      - name: Commit controlled fixes
        run: |
          git config user.name "Elearning Cloud CI"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add --all
          git commit -m "style: complete Moodle 5.0 file documentation"
          git push origin HEAD:main
