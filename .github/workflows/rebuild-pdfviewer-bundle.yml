name: Rebuild PDF.js viewer bundle

'on':
  push:
    branches:
      - fix/pdfjs-stable-viewer
    paths:
      - .github/workflows/rebuild-pdfviewer-bundle.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdfjs-stable-viewer
          path: plugin
          fetch-depth: 0

      - name: Check out Moodle 5.0
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_500_STABLE
          path: moodle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: moodle/.nvmrc
          cache: npm
          cache-dependency-path: moodle/package-lock.json

      - name: Install Moodle JavaScript dependencies
        working-directory: moodle
        run: npm ci

      - name: Build the PDF viewer AMD bundle
        run: |
          rm -rf moodle/mod/videoplayer
          cp -a plugin moodle/mod/videoplayer
          cd moodle
          npx grunt amd --root=mod/videoplayer

      - name: Persist generated bundle and source map
        run: |
          cp moodle/mod/videoplayer/amd/build/pdfviewer.min.js plugin/amd/build/pdfviewer.min.js
          cp moodle/mod/videoplayer/amd/build/pdfviewer.min.js.map plugin/amd/build/pdfviewer.min.js.map
          rm plugin/.github/workflows/rebuild-pdfviewer-bundle.yml

      - name: Validate generated output
        working-directory: plugin
        run: |
          node --check amd/build/pdfviewer.min.js
          grep -q 'pdfjs-progress' amd/build/pdfviewer.min.js
          grep -q 'pdfjs-points' amd/build/pdfviewer.min.js
          grep -q 'pdfjs-achievements' amd/build/pdfviewer.min.js
          test "$(grep -c 'ebook-' amd/build/pdfviewer.min.js)" -eq 0
          test -f amd/build/pdfviewer.min.js.map
          git diff --check

      - name: Commit generated assets
        working-directory: plugin
        run: |
          git config user.name "Elearning Cloud"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add -A
          git commit -m "build(pdf): regenerate PDF.js viewer bundle"
          git push origin HEAD:fix/pdfjs-stable-viewer
