name: Finalize 1.1.18 release candidate

on:
  push:
    branches:
      - production/hardening-1.1.18
    paths:
      - '.ci/finalize-1.1.18.py'
      - '.github/workflows/finalize-1.1.18.yml'

permissions:
  contents: write

concurrency:
  group: finalize-1-1-18
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply final release candidate changes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: production/hardening-1.1.18
          fetch-depth: 0

      - name: Apply final changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .ci/finalize-1.1.18.py
          python3 .ci/finalize-1.1.18.py

      - name: Verify syntax and critical bundles
        shell: bash
        run: |
          set -euo pipefail
          php -l locallib.php
          php -l report.php
          php -l lang/en/videoplayer.php
          php -l lang/es/videoplayer.php
          node --check amd/src/pdfviewer.js
          node --check amd/build/pdfviewer.min.js
          cmp amd/src/pdfviewer.js amd/build/pdfviewer.min.js

      - name: Commit final release candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .ci/finalize-1.1.18.py .github/workflows/finalize-1.1.18.yml
          git config user.name 'Drive Resource CI'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize 1.1.18 progress reporting and CI blockers'
          git push origin HEAD:production/hardening-1.1.18
