name: Finalize mobile media fix

'on':
  push:
    branches:
      - fix/mobile-pdf-video-seek
    paths:
      - .github/workflows/finalize-mobile-media-fix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-pdf-video-seek
          path: plugin
          fetch-depth: 0

      - name: Update documentation and CI contracts
        working-directory: plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          changelog_entry = '''
          ## 1.1.28-beta - 2026-08-06

          ### Fixed

          - Forced protected PDFs to open on page 1 while continuing to record reading progress.
          - Removed the oversized empty mobile PDF viewport and restored real scrollable zoom.
          - Hardened protected video byte-range delivery so seek requests cannot silently fall back to HTTP 200 and restart playback.
          - Added adaptive video preload, stable proxy validators, NGINX buffering bypass and bounded client-side seek recovery.

          '''.lstrip()
          if '## 1.1.28-beta - 2026-08-06' not in changelog_text:
              first_break = changelog_text.find('\n') + 1
              changelog.write_text(
                  changelog_text[:first_break] + '\n' + changelog_entry + changelog_text[first_break:],
                  encoding='utf-8'
              )

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_entry = '''
          ## Release 1.1.28-beta

          This release improves physical-device playback and reading. PDFs always open on page 1, mobile zoom uses the real canvas dimensions without an oversized empty viewport, and protected videos require valid `206 Partial Content` responses for seeks. The proxy retries Range negotiation across Google redirects, uses a stable Moodle-facing ETag, disables reverse-proxy buffering and never exposes the upstream URL.
          '''.lstrip()
          if '## Release 1.1.28-beta' not in readme_text:
              readme.write_text(readme_text.rstrip() + '\n\n' + readme_entry + '\n', encoding='utf-8')

          doc_entries = {
              'docs/architecture.md': '''
          ## Mobile media reliability in 1.1.28-beta

          The protected stream boundary now treats browser Range requests as strict contracts. A seek request is emitted to the learner only when Google returns a valid `206` response with `Content-Range`; an upstream `200` is discarded and retried with an explicit Range header. Browser-facing validators are owned by Moodle so redirect-specific Google ETags cannot downgrade later seeks to complete responses. PDF rendering remains local PDF.js and starts from page 1.
          ''',
              'docs/developer-guide.md': '''
          ## Mobile media regression rules

          Keep `amd/src/plyr.js` and `amd/build/plyr.min.js` synchronized through Moodle Grunt. Do not reload the video source to recover a seek. The client may retry the requested `currentTime` a bounded number of times, while `http_range_proxy` remains the authoritative fix. PDF templates must receive `initialpage = 1`; reading progress may still store `lastpage` for reporting.
          ''',
              'docs/security.md': '''
          ## Range and validator hardening

          Drive Resource does not forward browser `If-Range` validators to Google. The proxy emits a stable, URL-derived private ETag, validates `Content-Type`, requires `206` plus `Content-Range` for byte requests and sends `X-Accel-Buffering: no`. These headers improve streaming without exposing file IDs, redirect URLs or Google validators.
          ''',
              'docs/installation.md': '''
          ## Upgrade verification for 1.1.28-beta

          After upgrade and cache purge, test a protected MP4 on Android Chrome and iPhone Safari. Seeking to the middle must return `206 Partial Content`, preserve the selected timestamp and avoid a restart at zero. Test a PDF at 100% and above 100%; it must open at page 1, avoid a large empty area below the page and allow horizontal scrolling when zoomed.
          ''',
          }
          for filename, entry in doc_entries.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = entry.strip().splitlines()[0]
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + entry.strip() + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/moodle-50-ci.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          contract = '''      - name: Mobile PDF and video seek contract
                run: |
                  grep -Fq "'initialpage' => \\$initialpage" plugin/view.php
                  grep -q 'videomimetype' plugin/templates/video.mustache
                  grep -q 'registerSeekRecovery' plugin/amd/src/plyr.js
                  grep -q 'slow-2g' plugin/amd/build/plyr.min.js
                  grep -q 'emptied' plugin/amd/build/plyr.min.js
                  grep -q 'is_range_response_usable' plugin/classes/local/http_range_proxy.php
                  grep -q 'UPSTREAM_RANGE_UNSUPPORTED' plugin/classes/local/http_range_proxy.php
                  grep -q 'X-Accel-Buffering: no' plugin/classes/local/http_range_proxy.php
                  grep -q 'max-width: none !important' plugin/styles_pdf_mobile.css
          '''
          marker = '      - name: PHPUnit\n'
          if 'Mobile PDF and video seek contract' not in workflow_text:
              workflow_text = workflow_text.replace(marker, contract + '\n' + marker)
              workflow.write_text(workflow_text, encoding='utf-8')
          PY

      - name: Check out Moodle 5.0
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_500_STABLE
          path: moodle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: moodle/.nvmrc

      - name: Install Moodle JavaScript dependencies
        working-directory: moodle
        run: npm ci

      - name: Build changed AMD modules
        run: |
          rm -rf moodle/mod/videoplayer
          cp -a plugin moodle/mod/videoplayer
          cd moodle
          npx grunt amd --root=mod/videoplayer

      - name: Persist generated Plyr module
        run: |
          cp moodle/mod/videoplayer/amd/build/plyr.min.js plugin/amd/build/plyr.min.js
          cp moodle/mod/videoplayer/amd/build/plyr.min.js.map plugin/amd/build/plyr.min.js.map
          rm plugin/.github/workflows/finalize-mobile-media-fix.yml

      - name: Validate source and generated output
        working-directory: plugin
        run: |
          php -l view.php
          php -l classes/local/http_range_proxy.php
          php -l tests/http_range_proxy_test.php
          node --check amd/src/plyr.js
          node --check amd/build/plyr.min.js
          grep -q 'slow-2g' amd/build/plyr.min.js
          grep -q 'emptied' amd/build/plyr.min.js
          grep -q 'UPSTREAM_RANGE_UNSUPPORTED' classes/local/http_range_proxy.php
          git diff --check

      - name: Commit finalized production assets
        working-directory: plugin
        run: |
          git config user.name "Elearning Cloud"
          git config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git add -A
          git commit -m "build: finalize mobile PDF and video seek fix"
          git push origin HEAD:fix/mobile-pdf-video-seek
