name: Generate production AMD bundles

on:
  push:
    branches:
      - production/hardening-1.1.18
    paths:
      - '.github/workflows/generate-amd-builds.yml'

permissions:
  contents: write

concurrency:
  group: generate-drive-resource-amd-builds
  cancel-in-progress: false

jobs:
  build:
    name: Build AMD with Moodle Grunt
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: production/hardening-1.1.18
          path: plugin
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, json, mbstring, pgsql, simplexml, sodium, xml, xmlreader, zip
          coverage: none

      - name: Install moodle-plugin-ci
        shell: bash
        run: |
          set -euo pipefail
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle build environment
        shell: bash
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_500_STABLE

      - name: Generate AMD bundles
        shell: bash
        run: |
          set -o pipefail
          set +e
          moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee grunt-build.log
          status=${PIPESTATUS[0]}
          set -e

          # moodle-plugin-ci intentionally returns non-zero when Grunt generates
          # files that differ from Git. This workflow exists to commit exactly
          # those generated artifacts. Actual lint errors are rejected below.
          if grep -E '^.*[0-9]+:[0-9]+.*(error|warning)' grunt-build.log; then
            echo 'Grunt reported JavaScript or CSS lint findings.' >&2
            exit 1
          fi

          for module in fullscreen progress pdfmobile pdfviewer bookviewer plyr; do
            test -f "plugin/amd/build/${module}.min.js"
            test -f "plugin/amd/build/${module}.min.js.map"
            node --check "plugin/amd/build/${module}.min.js"
          done

          if [ "$status" -eq 0 ]; then
            echo 'AMD bundles were already current.'
          fi

      - name: Commit generated AMD artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd plugin
          git rm .github/workflows/generate-amd-builds.yml
          git config user.name 'Drive Resource CI'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git add amd/build
          git commit -m 'Rebuild production AMD bundles with Moodle Grunt'
          git push origin HEAD:production/hardening-1.1.18
