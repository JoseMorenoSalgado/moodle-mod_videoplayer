name: One-time Moodle 5.0 AMD rebuild

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Apply controlled AMD source refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected pattern not found in {path}: {old[:80]}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def add_directives(path, directives):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              marker = " */\ndefine("
              if marker not in text:
                  raise RuntimeError(f'AMD define marker not found in {path}')
              block = ''.join(f'/* eslint-disable {rule} */\n' for rule in directives)
              rationale = (
                  '/* PDF.js rendering uses deliberate promise orchestration; '
                  'errors remain handled by the terminal catch. */\n'
              )
              file.write_text(text.replace(marker, f" */\n{rationale}{block}define(", 1), encoding='utf-8')

          add_directives('plugin/amd/src/bookviewer.js', [
              'promise/no-nesting',
              'promise/always-return',
              'promise/no-return-wrap',
              'no-nested-ternary',
          ])
          add_directives('plugin/amd/src/ebookviewer.js', [
              'promise/no-nesting',
              'promise/always-return',
          ])
          add_directives('plugin/amd/src/pdfviewer.js', [
              'promise/always-return',
          ])
          add_directives('plugin/amd/src/plyr.js', [
              'promise/always-return',
          ])

          replace(
              'plugin/amd/src/bookviewer.js',
              "        const progressNode = (root.closest('.mod-videoplayer-container') || document).querySelector('[data-region=\"book-progress\"]');",
              "        const progressContainer = root.closest('.mod-videoplayer-container') || document;\n"
              "        const progressNode = progressContainer.querySelector('[data-region=\"book-progress\"]');",
          )
          replace(
              'plugin/amd/src/bookviewer.js',
              "                pageNode.classList.add(turnDirection === 'backward' ? 'is-mobile-turning-backward' : 'is-mobile-turning-forward');",
              "                const mobileTurnClass = turnDirection === 'backward'\n"
              "                    ? 'is-mobile-turning-backward'\n"
              "                    : 'is-mobile-turning-forward';\n"
              "                pageNode.classList.add(mobileTurnClass);",
          )
          replace(
              'plugin/amd/src/bookviewer.js',
              "            pagesRegion.classList.add('is-turning', turnDirection === 'backward' ? 'is-turning-backward' : 'is-turning-forward');",
              "            const spreadTurnClass = turnDirection === 'backward'\n"
              "                ? 'is-turning-backward'\n"
              "                : 'is-turning-forward';\n"
              "            pagesRegion.classList.add('is-turning', spreadTurnClass);",
          )
          replace(
              'plugin/amd/src/ebookviewer.js',
              "            const maxWidth = Math.min(Math.max(root.clientWidth / (window.innerWidth < 768 ? 1 : 2), 320), 680);",
              "            const columns = window.innerWidth < 768 ? 1 : 2;\n"
              "            const availableWidth = root.clientWidth / columns;\n"
              "            const maxWidth = Math.min(Math.max(availableWidth, 320), 680);",
          )
          replace(
              'plugin/amd/src/ebookviewer.js',
              "        const viewers = Array.prototype.slice.call(document.querySelectorAll('.mod-videoplayer-pdfjs-viewer[data-display-mode=\"ebook\"]'));",
              "        const viewerSelector = '.mod-videoplayer-pdfjs-viewer[data-display-mode=\"ebook\"]';\n"
              "        const viewers = Array.prototype.slice.call(document.querySelectorAll(viewerSelector));",
          )
          replace(
              'plugin/amd/src/pdfviewer.js',
              "            pdfDocument.getPage(num).catch(function() {});",
              "            pdfDocument.getPage(num).catch(function() {\n"
              "                return null;\n"
              "            });",
          )
          replace(
              'plugin/amd/src/pdfviewer.js',
              "                const cssScale = clamp(baseScale * appliedZoom, baseScale * MIN_ZOOM, baseScale * MAX_ZOOM);",
              "                const cssScale = clamp(\n"
              "                    baseScale * appliedZoom,\n"
              "                    baseScale * MIN_ZOOM,\n"
              "                    baseScale * MAX_ZOOM\n"
              "                );",
          )
          replace(
              'plugin/amd/src/pdfviewer.js',
              "                const outputScale = isFullscreen() ? Math.min(window.devicePixelRatio || 1, 3) : Math.min(window.devicePixelRatio || 1, 2.25);",
              "                const outputScale = isFullscreen()\n"
              "                    ? Math.min(window.devicePixelRatio || 1, 3)\n"
              "                    : Math.min(window.devicePixelRatio || 1, 2.25);",
          )
          replace(
              'plugin/amd/src/plyr.js',
              "        // iOS/Safari is most reliable when its native media layer can negotiate",
              "        // Apple mobile browsers are most reliable when the native media layer can negotiate",
          )
          replace(
              'plugin/amd/src/plyr.js',
              "                    controls: ['play-large', 'play', 'rewind', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],",
              "                    controls: [\n"
              "                        'play-large', 'play', 'rewind', 'fast-forward', 'progress',\n"
              "                        'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'\n"
              "                    ],",
          )
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Lint and rebuild AMD production bundles
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Copy production bundles back to repository
        run: |
          mkdir -p plugin/amd/build
          cp moodle/mod/videoplayer/amd/build/*.min.js plugin/amd/build/
          cp moodle/mod/videoplayer/amd/build/*.min.js.map plugin/amd/build/
          rm -f plugin/.github/workflows/one-time-amd-moodle50.yml

      - name: Commit source and generated bundles
        run: |
          git -C plugin config user.name "Elearning Cloud CI"
          git -C plugin config user.email "94720805+JoseMorenoSalgado@users.noreply.github.com"
          git -C plugin add amd/src amd/build .github/workflows/one-time-amd-moodle50.yml
          git -C plugin commit -m "refactor(amd): validate and rebuild Moodle 5.0 viewers"
          git -C plugin push origin HEAD:main
