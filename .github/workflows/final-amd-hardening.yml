name: Final AMD hardening

on:
  push:
    branches:
      - production/hardening-1.1.18
    paths:
      - '.github/workflows/final-amd-hardening.yml'

permissions:
  contents: write

concurrency:
  group: final-drive-resource-amd-hardening
  cancel-in-progress: false

jobs:
  harden:
    name: Patch sources, compile AMD and commit
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          ref: production/hardening-1.1.18
          path: plugin
          fetch-depth: 0

      - name: Restore serialized PDF rendering and remove legacy iframe AMD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugin/amd/src/pdfviewer.js')
          text = path.read_text(encoding='utf-8')
          old = """            const safe = Math.max(1, Math.min(pdfDocument.numPages, num));
              pageNumber = safe;
              if (rendering) {
                  pendingPage = safe;
                  renderVersion++;
                  rendering = false;
              }
              renderPage(safe);
          """
          new = """            const safe = Math.max(1, Math.min(pdfDocument.numPages, num));
              if (rendering) {
                  pendingPage = safe;
                  return;
              }
              pageNumber = safe;
              renderPage(safe);
          """
          if old not in text:
              raise SystemExit('Expected unsafe PDF render queue pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f plugin/amd/src/fullscreen.js
          rm -f plugin/amd/build/fullscreen.min.js
          rm -f plugin/amd/build/fullscreen.min.js.map

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, json, mbstring, pgsql, simplexml, sodium, xml, xmlreader, zip
          coverage: none

      - name: Install moodle-plugin-ci
        shell: bash
        run: |
          set -euo pipefail
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle build environment
        shell: bash
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_500_STABLE

      - name: Compile final AMD bundles
        shell: bash
        run: |
          set -euo pipefail
          pushd moodle/mod/videoplayer/amd
          npx grunt amd
          popd

          rm -rf plugin/amd/build
          mkdir -p plugin/amd/build
          cp -a moodle/mod/videoplayer/amd/build/. plugin/amd/build/

          for module in progress pdfmobile pdfviewer bookviewer plyr; do
            test -f "plugin/amd/build/${module}.min.js"
            test -f "plugin/amd/build/${module}.min.js.map"
            node --check "plugin/amd/build/${module}.min.js"
          done

          test ! -f plugin/amd/src/fullscreen.js
          test ! -f plugin/amd/build/fullscreen.min.js
          test ! -f plugin/amd/build/fullscreen.min.js.map

      - name: Commit final AMD hardening
        shell: bash
        run: |
          set -euo pipefail
          cd plugin
          git rm .github/workflows/final-amd-hardening.yml
          git config user.name 'Drive Resource CI'
          git config user.email '94720805+JoseMorenoSalgado@users.noreply.github.com'
          git add -A amd/src amd/build
          git commit -m 'Finalize serialized PDF rendering and Grunt AMD bundles'
          git push origin HEAD:production/hardening-1.1.18
