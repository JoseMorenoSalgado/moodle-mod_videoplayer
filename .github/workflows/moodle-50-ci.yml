name: Moodle 5.0 compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: moodle-50-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.database }} · Moodle 5.0
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
        database:
          - mariadb
          - pgsql

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, pgsql, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 5.0 test environment
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_500_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: PHP syntax
        run: moodle-plugin-ci phplint

      - name: Moodle coding style
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache validation
        run: moodle-plugin-ci mustache

      - name: AMD and JavaScript validation
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PDF.js native ESM loader contract
        run: |
          BUNDLE=plugin/amd/build/pdfjsloader.min.js
          test -f "$BUNDLE"
          grep -q 'createElement("script")' "$BUNDLE"
          grep -q 'type="module"' "$BUNDLE"
          grep -q 'pdf.worker.min.mjs' "$BUNDLE"
          if grep -q '_systemImportTransformerGlobalIdentifier' "$BUNDLE"; then
            echo 'PDF.js ESM loader was transformed into a RequireJS dynamic import.' >&2
            exit 1
          fi

      - name: Responsive Ebook contract
        run: |
          SOURCE=plugin/amd/src/ebookviewer.js
          BUNDLE=plugin/amd/build/ebookviewer.min.js
          VIEW=plugin/view.php
          STYLES=plugin/styles_pageflip_fix.css
          test -s "$SOURCE"
          test -s "$BUNDLE"
          test -s "$STYLES"
          grep -q 'is-phone-single-page' "$SOURCE"
          grep -q 'is-desktop-double-page' "$SOURCE"
          grep -q 'requestIdleCallback' "$SOURCE"
          grep -q 'usePortrait: phoneLayout' "$SOURCE"
          grep -q 'styles_pageflip_fix.css' "$VIEW"
          grep -q 'mod_videoplayer/ebookviewer' "$BUNDLE"
          grep -q 'mod-videoplayer-page-settle' "$STYLES"
          if grep -q 'MAX_INITIAL_RENDER_PAGES' "$SOURCE"; then
            echo 'Ebook viewer returned to eager multi-page rendering.' >&2
            exit 1
          fi

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
